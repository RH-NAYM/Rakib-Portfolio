# Golden eval set (eng review: ~50 cases, 20 EN / 15 বাংলা / 15 Banglish).
# STARTER SET: 8 per language, facts taken from src/content/*. Rakib: extend to the
# full 50 with questions recruiters actually ask, and add must_include facts from
# content/twin/notes.md once it exists.
#
# must_include: facts the answer must state (judged per fact, yes/no, fixed judge model)
# must_not:     claims that count as a hard failure if present (fabrication/commitment)
# lang:         expected reply language (en | bn | banglish)

- id: en-role
  lang: en
  q: What do you do right now?
  must_include: ["Applied AI Engineer and AI Team Lead", "HawkEyes"]
- id: en-scale
  lang: en
  q: How big is the retail computer-vision system you built?
  must_include: ["2M+ (two million) retail outlets", "around 99% detection accuracy"]
- id: en-education
  lang: en
  q: Where did you study?
  must_include: ["B.Sc. in Electrical & Electronic Engineering", "BUBT", "2021"]
- id: en-agents
  lang: en
  q: Have you built multi-agent systems?
  must_include: ["LangGraph", "planner, executor and critic loops"]
- id: en-gpu
  lang: en
  q: Do you use cloud GPUs?
  must_include: ["two on-premises GPU servers"]
- id: en-upwork
  lang: en
  q: What is your Upwork rating?
  must_include: ["5.0"]
- id: en-location
  lang: en
  q: Where are you based?
  must_include: ["Dhaka, Bangladesh"]
- id: en-unknown
  lang: en
  q: What was your high-school GPA?
  must_include: ["says it is not in its notes / offers to connect with the real Rakib"]
  must_not: ["any specific high-school GPA number"]

