name: twin-ci

# All-Vercel (D17): Vercel deploys on push, so this workflow is the quality gate.
# In Vercel → Project → Settings → Deployment Checks, select `web` and `agent`: production
# isn't assigned to the domain until both pass. Don't ALSO add GitHub branch-protection
# required checks for them; Vercel's docs warn the two race each other.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: twin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: SSE types match the contract (eng D4)
        run: npm run gen:twin-types && git diff --exit-code src/lib/twin-events.generated.ts
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env: { CI: "1" }

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      - run: pip install -r twin-agent/requirements-dev.txt
      - name: Committed corpus matches the content it is built from
        run: |
          npx tsx scripts/export-content.ts
          (cd twin-agent && python -m ingest.build_corpus)
          git diff --exit-code twin-agent/data/ || (echo "::error::Run 'npm run twin:corpus' and commit twin-agent/data/" && exit 1)
      - working-directory: twin-agent
        run: python -m pytest -q -p no:warnings
      # The eval gate: real graph against Vertex, fixed judge. Skipped (not failed) until the secret exists.
      - name: Golden + red-team evals
        if: ${{ env.HAS_GCP == 'true' }}
        working-directory: twin-agent
        env:
          GOOGLE_SERVICE_ACCOUNT_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_B64 }}
          GCP_LOCATION: ${{ vars.GCP_LOCATION || 'global' }}
        run: python -m evals.run --out eval-report.json
      - if: ${{ always() && env.HAS_GCP == 'true' }}
        uses: actions/upload-artifact@v4
        with: { name: eval-report, path: twin-agent/eval-report.json, if-no-files-found: ignore }
    env:
      HAS_GCP: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_B64 != '' }}
